# Builds llama.cpp's CUDA server image from unsloth's glm5next branch (mainline
# llama.cpp cannot load GLM-5.3-Flash yet), then builds the RunPod worker on top
# of it and pushes the result to GHCR.
name: Build image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  LLAMA_CPP_REPO: unslothai/llama.cpp
  LLAMA_CPP_REF: 86ebfef2c6a0f3359a2a07d2c215d61b0fa885c9
  # sm_90 = H100/H200, sm_120 = RTX PRO 6000 Blackwell. Limiting archs keeps
  # the CUDA compile inside the runner's time and disk budget.
  CUDA_DOCKER_ARCH: "90;120"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp

      - name: Build llama.cpp server image (glm5next)
        working-directory: llama.cpp
        run: |
          docker build -f .devops/cuda.Dockerfile --target server \
            --build-arg CUDA_DOCKER_ARCH="${CUDA_DOCKER_ARCH}" \
            -t llama-server-glm5next:local .

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build --build-arg BASE_IMAGE=llama-server-glm5next:local \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA}
